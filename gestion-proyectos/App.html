/* ---------------- Utilidades ---------------- */
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function $(sel) { return document.querySelector(sel); }
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function fmtDate(d) {
  if (!d) return '';
  const p = String(d).slice(0, 10).split('-');
  if (p.length < 3) return esc(d);
  return parseInt(p[2], 10) + ' ' + MESES[parseInt(p[1], 10) - 1] + ' ' + p[0];
}
function fmtDateTime(d) { return d ? fmtDate(d) + ' ' + String(d).slice(11, 16) : ''; }
function fmtNum(n) { return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('es-PE'); }
function fmtMoney(n, cur) {
  cur = cur || cfg('moneda') || 'PEN';
  const v = Number(n) || 0;
  try { return new Intl.NumberFormat('es-PE', { style: 'currency', currency: cur }).format(v); }
  catch (e) { return cur + ' ' + v.toFixed(2); }
}
function fmtTotals(docs) {
  const by = {};
  docs.forEach(function (d) { const c = d.moneda || cfg('moneda'); by[c] = (by[c] || 0) + (Number(d.monto) || 0); });
  const keys = Object.keys(by);
  if (!keys.length) return fmtMoney(0);
  return keys.map(function (k) { return fmtMoney(by[k], k); }).join(' · ');
}
function isoToDate(iso) { const p = String(iso).slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(iso, n) {
  const d = isoToDate(iso); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function daysUntil(iso) { return Math.round((isoToDate(iso) - isoToDate(hoy())) / 86400000); }
function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }
function cfg(k) { return S.data && S.data.config ? S.data.config[k] : ''; }
function hoy() { return S.data ? S.data.hoy : new Date().toISOString().slice(0, 10); }
function isOpen(a) { return a.estado !== 'Completada' && a.estado !== 'Cancelada'; }
function isOverdue(a) { return isOpen(a) && a.fechaLimite && a.fechaLimite < hoy(); }
function projActive(p) { return p.estado !== 'Completado' && p.estado !== 'Cancelado'; }
function proj(id) { return S.data.proyectos.find(function (p) { return p.id === id; }); }
function byId(list, id) { return S.data[list].find(function (x) { return x.id === id; }); }
function stagesOf(pid) {
  return S.data.etapas.filter(function (e) { return e.proyectoId === pid; })
    .sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
}
function actsOf(pid) { return S.data.actividades.filter(function (a) { return a.proyectoId === pid; }); }
function docsOf(pid) { return S.data.documentos.filter(function (d) { return d.proyectoId === pid; }); }
function currentStage(pid) {
  const st = stagesOf(pid);
  if (!st.length) return null;
  return st.find(function (e) { return e.estado !== 'Completada'; }) || { nombre: 'Todas completadas', done: true };
}
function sortByName(a, b) { return String(a.nombre).localeCompare(String(b.nombre)); }

/* --- Urgencia de tareas --- */
function urg(a) {
  if (!isOpen(a)) return 'done';
  if (!a.fechaLimite) return 'none';
  const d = daysUntil(a.fechaLimite);
  return d < 0 ? 'late' : d === 0 ? 'today' : d <= 7 ? 'week' : 'later';
}
const URG_RANK = { late: 0, today: 1, week: 2, later: 3, none: 4, done: 5 };
const URG_CLASS = { late: 'bad', today: 'warn', week: 'info', later: '', none: '', done: 'ok' };
function dueLabel(a) {
  if (!a.fechaLimite) return isOpen(a) ? 'Sin fecha' : '';
  const d = daysUntil(a.fechaLimite);
  if (!isOpen(a)) return 'Plazo ' + fmtDate(a.fechaLimite);
  if (d < 0) return 'ATRASADA ' + plural(-d, 'día', 'días');
  if (d === 0) return 'Vence HOY';
  if (d === 1) return 'Vence mañana';
  if (d <= 7) return 'Vence en ' + d + ' días';
  return 'Vence ' + fmtDate(a.fechaLimite);
}
function sortActs(a, b) {
  const ua = URG_RANK[urg(a)], ub = URG_RANK[urg(b)];
  if (ua !== ub) return ua - ub;
  const pa = PRIORIDADES.indexOf(a.prioridad), pb = PRIORIDADES.indexOf(b.prioridad);
  if ((a.fechaLimite || '9') !== (b.fechaLimite || '9')) return (a.fechaLimite || '9') < (b.fechaLimite || '9') ? -1 : 1;
  return pa - pb;
}

/* --- Personas --- */
function personRecord(name) { return S.data.personal.find(function (p) { return p.nombre === name; }); }
function people() {
  const map = {};
  S.data.personal.filter(function (p) { return p.activo !== 'No'; }).forEach(function (p) { map[p.nombre] = { nombre: p.nombre, rec: p }; });
  S.data.actividades.forEach(function (a) {
    const k = a.responsable || '';
    if (!map[k] && (k || isOpen(a))) map[k] = { nombre: k, rec: personRecord(k) || null };
  });
  return Object.keys(map).map(function (k) {
    const p = map[k];
    p.acts = S.data.actividades.filter(function (a) { return (a.responsable || '') === k; });
    p.open = p.acts.filter(isOpen);
    p.late = p.open.filter(function (a) { return urg(a) === 'late'; }).length;
    p.today = p.open.filter(function (a) { return urg(a) === 'today'; }).length;
    p.week = p.open.filter(function (a) { return urg(a) === 'week'; }).length;
    p.blocked = p.open.filter(function (a) { return a.estado === 'Bloqueada'; }).length;
    p.worst = p.late || p.blocked ? 'late' : p.today ? 'today' : p.week ? 'week' : p.open.length ? 'later' : 'done';
    p.certs = p.rec ? S.data.certificaciones.filter(function (c) { return c.personalId === p.rec.id; }) : [];
    p.certAlert = p.certs.map(certStatus).filter(function (s) { return s.cls !== 'ok' && s.cls !== ''; })[0] || null;
    return p;
  }).filter(function (p) { return p.nombre || p.open.length; });
}
function personNames() {
  return people().map(function (p) { return p.nombre; }).filter(String).sort(function (a, b) { return a.localeCompare(b); });
}
function personOptions(current) {
  const names = personNames();
  if (current && names.indexOf(current) < 0) names.push(current);
  return [{ v: '', l: '— Sin asignar —' }].concat(names.map(function (n) {
    const r = personRecord(n); return { v: n, l: n + (r && r.cargo ? ' · ' + r.cargo : '') };
  }));
}
function setYo(name) {
  S.yo = name || '';
  try { if (S.yo) localStorage.setItem('gp-yo', S.yo); else localStorage.removeItem('gp-yo'); } catch (e) { /* sin almacenamiento */ }
}

/* --- Estados de certificaciones, máquinas y stock --- */
function certStatus(c) {
  if (!c.vencimiento) return { t: 'Sin fecha de vencimiento', cls: '' };
  const d = daysUntil(c.vencimiento);
  if (d < 0) return { t: 'VENCIDA hace ' + plural(-d, 'día', 'días'), cls: 'bad' };
  if (d <= 30) return { t: 'Vence en ' + plural(d, 'día', 'días'), cls: 'warn' };
  return { t: 'Vigente hasta ' + fmtDate(c.vencimiento), cls: 'ok' };
}
function maintStatus(e) {
  if (e.estado === 'Fuera de servicio') return { t: 'Fuera de servicio', cls: 'bad', k: 'off' };
  if (e.estado === 'En mantenimiento') return { t: 'En mantenimiento', cls: 'warn', k: 'mant' };
  if (!e.proximoMant) return { t: 'Mantenimiento sin programar', cls: '', k: 'none' };
  const d = daysUntil(e.proximoMant);
  if (d < 0) return { t: 'Mantenimiento ATRASADO ' + plural(-d, 'día', 'días'), cls: 'bad', k: 'late' };
  if (d <= 7) return { t: d === 0 ? 'Mantenimiento HOY' : 'Mantenimiento en ' + plural(d, 'día', 'días'), cls: 'warn', k: 'soon' };
  return { t: 'Próximo mant. ' + fmtDate(e.proximoMant), cls: 'ok', k: 'ok' };
}
function stockStatus(m) {
  const s = Number(m.stock) || 0, min = Number(m.stockMinimo) || 0;
  if (s <= 0) return { t: 'AGOTADO', cls: 'bad', k: 'out' };
  if (min && s <= min) return { t: 'Stock bajo', cls: 'warn', k: 'low' };
  return { t: 'OK', cls: 'ok', k: 'ok' };
}
function stateClass(s) {
  if (['Completado', 'Completada', 'Aprobada', 'Aprobado', 'Pagada', 'Entregada', 'Operativo', 'Aprobado para fabricación', 'Entrada'].indexOf(s) >= 0) return 'ok';
  if (['Cancelado', 'Cancelada', 'Rechazada', 'Rechazado', 'Anulada', 'Bloqueada', 'Fuera de servicio', 'Obsoleto'].indexOf(s) >= 0) return 'bad';
  if (['En pausa', 'En revisión', 'Por cobrar', 'Enviada', 'Facturada', 'Observado', 'En mantenimiento'].indexOf(s) >= 0) return 'warn';
  if (['En curso', 'Confirmada', 'En proceso', 'Emitida', 'Vigente', 'En elaboración', 'Salida'].indexOf(s) >= 0) return 'info';
  return '';
}
function pill(s, cls) { return '<span class="pill ' + (cls === undefined ? stateClass(s) : cls) + '">' + esc(s) + '</span>'; }
function prioPill(p) { return p === 'Alta' ? pill('Prioridad alta', 'bad') : ''; }
function progress(v) {
  v = Math.max(0, Math.min(100, Number(v) || 0));
  return '<div class="progress ' + (v === 100 ? 'ok' : '') + '"><span style="width:' + v + '%"></span></div>';
}
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = ''; }, err ? 5000 : 2400);
}

/* ---------------- Servidor ---------------- */
function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (window.DB) return window.DB.call(fn, args); // versión Firebase: responde al instante
  return new Promise(function (resolve, reject) {
    let done = false;
    // Si Google tarda, avisar en vez de quedarse "en nada"
    const slow = setTimeout(function () { if (!done) toast('Sigue guardando, espera un momento…'); }, 4000);
    const limit = setTimeout(function () {
      if (done) return;
      done = true;
      reject(new Error('Google no respondió en 45 segundos. Revisa tu internet y vuelve a intentarlo. ' +
        'Si se repite, recarga la página.'));
    }, 45000);
    const finish = function (cb) { return function (x) { if (done) return; done = true; clearTimeout(slow); clearTimeout(limit); cb(x); }; };
    const r = google.script.run.withSuccessHandler(finish(resolve)).withFailureHandler(finish(function (e) {
      reject(e && e.message ? e : new Error(String(e)));
    }));
    r[fn].apply(r, args);
  });
}
function mutate(fn, args, okMsg, quiet) {
  // quiet: la pantalla ya muestra el cambio (botones rápidos), así que no se bloquea mientras guarda
  if (!quiet) document.body.classList.add('saving');
  return api.apply(null, [fn].concat(args)).then(function (data) {
    S.data = data; S.hist = null;
    document.body.classList.remove('saving');
    render();
    if (okMsg) toast(okMsg);
    return true;
  }).catch(function (e) {
    document.body.classList.remove('saving');
    toast((e.message || 'No se pudo guardar').replace(/^Error:\s*/, ''), true);
    return false;
  });
}
/* --- Versión Firebase: pantallas de inicio de sesión y datos en tiempo real --- */
function gate(kind, info) {
  info = info || {};
  if (kind !== 'cargando' || !S.data) S.data = null;
  document.body.classList.add('gated');
  $('#page-title').textContent = cfg('empresa') || 'Gestión de Proyectos';
  $('#topbar-actions').innerHTML = '';
  let html;
  if (kind === 'login') {
    html = '<h2>Bienvenido</h2><p class="muted">Entra con tu cuenta de Google para ver tus proyectos y tareas.</p>' +
      (info.error ? '<p class="txt-bad small">' + esc(info.error) + '</p>' : '') +
      '<button class="btn primary big" data-act="login">' + icon('star', 18) + 'Entrar con Google</button>';
  } else if (kind === 'sin-acceso') {
    html = '<h2>Tu cuenta aún no tiene acceso</h2><p>Entraste como <b class="selectable">' + esc(info.email) + '</b>.</p>' +
      '<p class="muted">Pide al administrador que agregue este correo en <b>Ajustes → Acceso</b> y vuelve a entrar.</p>' +
      '<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn" data-act="logout">Usar otra cuenta</button>' +
      '<button class="btn primary" data-act="reload">Ya me dieron acceso</button></div>';
  } else if (kind === 'error') {
    html = '<h2>No se pudo conectar</h2><p class="txt-bad">' + esc(info.message) + '</p>' +
      '<div class="row" style="justify-content:center"><button class="btn" data-act="logout">Salir</button><button class="btn primary" data-act="reload">Reintentar</button></div>';
  } else {
    html = '<div class="loading">Cargando' + (info.email ? ' datos de ' + esc(info.email) : '') + '…</div>';
  }
  $('#view').innerHTML = '<div class="card gate"><div class="card-b">' + html + '</div></div>';
}
let renderTimer = null;
function onLiveData(data) {
  S.data = data;
  document.body.classList.remove('gated');
  // Un cambio de otra persona no debe interrumpir lo que se escribe en un buscador
  clearTimeout(renderTimer);
  renderTimer = setTimeout(function () {
    const el = document.activeElement;
    const k = el && el.dataset ? el.dataset.filter : null;
    const pos = k && el.selectionStart;
    render();
    if (k) { const again = document.querySelector('[data-filter="' + k + '"]'); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { /* no aplica */ } } }
  }, 20);
}
window.onDbError = function (msg) { toast(msg, true); };

function load() {
  if (window.DB) { window.DB.start(onLiveData, gate); return Promise.resolve(); }
  // Datos incrustados por el servidor al abrir la página: se muestra al instante
  if (window.BOOT && window.BOOT.proyectos) { S.data = window.BOOT; window.BOOT = null; render(); return Promise.resolve(); }
  return api('getData').then(function (data) { S.data = data; render(); })
    .catch(function (e) { $('#view').innerHTML = '<div class="loading">No se pudo cargar: ' + esc(e.message) + '</div>'; });
}

/* ---------------- Navegación ---------------- */
function go(view, arg, push) {
  S.view = view; S.hist = null;
  if (view === 'proyecto') { S.pid = arg; if (push !== false) S.ptab = 'etapas'; }
  if (view === 'persona') { S.per = arg; if (push !== false) S.pertab = 'tareas'; }
  closeModal();
  if (push !== false && window.google && google.script && google.script.history) {
    google.script.history.push({ view: view, arg: arg || '' }, { v: view });
  }
  render();
  window.scrollTo(0, 0);
}
if (window.google && google.script && google.script.history) {
  google.script.history.setChangeHandler(function (e) {
    const st = e.state || {};
    go(st.view || 'panel', st.arg || null, false);
  });
}

/* ---------------- Render general ---------------- */
function render() {
  if (!S.data) return;
  const late = S.data.actividades.filter(isOverdue).length;
  const alertsN = alerts().filter(function (a) { return a.sev === 'bad'; }).length;
  const navBtn = function (n, size) {
    const active = S.view === n.id || (n.id === 'proyectos' && S.view === 'proyecto') || (n.id === 'equipo' && S.view === 'persona');
    let badge = '';
    if (n.id === 'pendientes' && late) badge = '<span class="badge-count">' + late + '</span>';
    if (n.id === 'panel' && alertsN) badge = '<span class="badge-count">' + alertsN + '</span>';
    return '<button data-act="nav" data-id="' + n.id + '" class="' + (active ? 'active' : '') + '">' +
      '<span class="ic">' + icon(n.id, size) + '</span><span>' + n.label + '</span>' + badge + '</button>';
  };
  $('#nav').innerHTML = NAV.map(function (n) { return navBtn(n, 18); }).join('');
  const inMas = ['documentos', 'almacen', 'calidad', 'maquinas', 'ajustes', 'ayuda'].indexOf(S.view) >= 0;
  $('#tabbar').innerHTML = TABBAR.map(function (id) {
    if (id === 'mas') return '<button data-act="menu-mas" class="' + (inMas ? 'active' : '') + '"><span class="ic">' + icon('mas', 22) + '</span><span>Más</span></button>';
    const n = NAV.find(function (x) { return x.id === id; });
    return navBtn(n, 22);
  }).join('');
  $('#brand-name').textContent = cfg('empresa') || 'Proyectos';

  const views = { panel: viewPanel, equipo: viewEquipo, persona: viewPersona, proyectos: viewProyectos, proyecto: viewProyecto,
    pendientes: viewPendientes, documentos: viewDocumentos, almacen: viewAlmacen, calidad: viewCalidad,
    maquinas: viewMaquinas, ajustes: viewAjustes, ayuda: viewAyuda };
  const out = (views[S.view] || viewPanel)();
  $('#page-title').innerHTML = out.title;
  $('#topbar-actions').innerHTML = out.actions || '';
  $('#view').innerHTML = out.body;
  if (out.after) out.after();
}

function actBtn(act, label, ic, cls, id, extra) {
  return '<button class="btn ' + (cls || '') + '" data-act="' + act + '"' + (id ? ' data-id="' + esc(id) + '"' : '') +
    (extra || '') + '>' + (ic ? icon(ic, 16) : '') + '<span class="lbl">' + label + '</span></button>';
}
function backTitle(text, to, arg) {
  return '<span class="row" style="gap:6px;min-width:0"><button class="icon-btn" data-act="nav" data-id="' + to + '"' +
    (arg ? ' data-arg="' + esc(arg) + '"' : '') + ' title="Volver" aria-label="Volver">' + icon('back', 22) + '</button>' +
    '<span class="ellipsis">' + esc(text) + '</span></span>';
}
function select(filter, options, value, labels) {
  return '<select data-filter="' + filter + '" aria-label="Filtro">' + options.map(function (o, i) {
    return '<option value="' + esc(o) + '"' + (o === value ? ' selected' : '') + '>' + esc(labels ? labels[i] : o) + '</option>';
  }).join('') + '</select>';
}
function kpi(label, value, sub, cls, nav, extra) {
  return '<div class="kpi ' + (cls || '') + '"' + (nav ? ' data-act="nav" data-id="' + nav + '"' : '') + (extra || '') + '>' +
    '<div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + esc(sub) + '</div></div>';
}
function card(title, body, action) {
  return '<div class="card"><div class="card-h"><h2>' + title + '</h2>' + (action || '') + '</div>' + body + '</div>';
}
function emptyBox(text, btn) { return '<div class="empty">' + text + (btn ? '<br><br>' + btn : '') + '</div>'; }

/* ---------------- Alertas ---------------- */
function alerts() {
  const out = [], d = S.data;
  const open = d.actividades.filter(isOpen);
  const late = open.filter(function (a) { return urg(a) === 'late'; });
  const today = open.filter(function (a) { return urg(a) === 'today'; });
  const blocked = open.filter(function (a) { return a.estado === 'Bloqueada'; });
  if (late.length) out.push({ sev: 'bad', ic: 'alert', t: plural(late.length, 'tarea atrasada', 'tareas atrasadas'), s: 'Ya pasó su fecha límite', act: 'nav', id: 'pendientes', f: 'Vencidas' });
  if (today.length) out.push({ sev: 'warn', ic: 'task', t: plural(today.length, 'tarea vence hoy', 'tareas vencen hoy'), s: today.slice(0, 3).map(function (a) { return a.titulo; }).join(' · '), act: 'nav', id: 'pendientes' });
  if (blocked.length) out.push({ sev: 'bad', ic: 'alert', t: plural(blocked.length, 'tarea con problema', 'tareas con problema'), s: 'Alguien reportó que no puede avanzar', act: 'nav', id: 'pendientes', f: 'Bloqueada' });
  people().filter(function (p) { return p.late; }).sort(function (a, b) { return b.late - a.late; }).slice(0, 4).forEach(function (p) {
    out.push({ sev: 'bad', ic: 'equipo', t: (p.nombre || 'Sin asignar') + ': ' + plural(p.late, 'tarea atrasada', 'tareas atrasadas'), s: p.open[0] ? p.open.slice().sort(sortActs)[0].titulo : '', act: 'open-per', id: p.nombre });
  });
  d.inspecciones.forEach(function (i) {
    const a = i.actividadId && byId('actividades', i.actividadId);
    if (i.resultado === 'Rechazado' && a && isOpen(a)) {
      const p = proj(i.proyectoId);
      out.push({ sev: 'bad', ic: 'calidad', t: 'Soldadura rechazada sin reparar', s: i.tipo + (i.elemento ? ' — ' + i.elemento : '') + (p ? ' · ' + p.nombre : ''), act: 'edit-act', id: a.id });
    }
  });
  d.materiales.forEach(function (m) {
    const s = stockStatus(m);
    if (s.k !== 'ok') out.push({ sev: s.k === 'out' ? 'bad' : 'warn', ic: 'almacen', t: m.nombre + ': ' + (s.k === 'out' ? 'agotado' : 'stock bajo'), s: 'Quedan ' + fmtNum(m.stock) + ' ' + (m.unidad || '') + (m.stockMinimo ? ' (mínimo ' + fmtNum(m.stockMinimo) + ')' : ''), act: 'edit-mat', id: m.id });
  });
  d.certificaciones.forEach(function (c) {
    const s = certStatus(c), per = byId('personal', c.personalId);
    if (s.cls === 'bad' || s.cls === 'warn') out.push({ sev: s.cls, ic: 'calidad', t: 'Certificación ' + c.proceso.split(' ')[0] + ' de ' + (per ? per.nombre : '¿?'), s: s.t, act: 'open-per', id: per ? per.nombre : '', tab: 'certs' });
  });
  d.equipos.forEach(function (e) {
    const s = maintStatus(e);
    if (s.k === 'off' || s.k === 'late' || s.k === 'soon') out.push({ sev: s.k === 'soon' ? 'warn' : 'bad', ic: 'maquinas', t: e.nombre + (e.codigo ? ' (' + e.codigo + ')' : ''), s: s.t, act: 'edit-eq', id: e.id });
  });
  return out.sort(function (a, b) { return (a.sev === 'bad' ? 0 : 1) - (b.sev === 'bad' ? 0 : 1); });
}
function alertRow(a) {
  return '<div class="list-item clickable alert-row ' + a.sev + '" data-act="' + a.act + '" data-id="' + esc(a.id) + '"' +
    (a.f ? ' data-f="' + esc(a.f) + '"' : '') + (a.tab ? ' data-tab="' + a.tab + '"' : '') + '>' +
    '<span class="alert-ic">' + icon(a.ic, 18) + '</span><div class="grow"><div class="title">' + esc(a.t) + '</div>' +
    (a.s ? '<div class="meta"><span>' + esc(a.s) + '</span></div>' : '') + '</div></div>';
}

/* ---------------- Inicio ---------------- */
function viewPanel() {
  const d = S.data, h = hoy();
  const activos = d.proyectos.filter(projActive);
  const abiertas = d.actividades.filter(isOpen);
  const vencidas = abiertas.filter(isOverdue);
  const cotPend = d.documentos.filter(function (x) { return x.tipo === 'Cotización' && ['Borrador', 'Enviada', 'En revisión'].indexOf(x.estado) >= 0; });
  const ocAbiertas = d.documentos.filter(function (x) { return x.tipo === 'Orden de compra' && x.estado !== 'Pagada' && x.estado !== 'Anulada'; });
  const factCobrar = d.documentos.filter(function (x) { return x.tipo === 'Factura' && (x.estado === 'Emitida' || x.estado === 'Por cobrar'); });

  let mine = '';
  if (S.yo) {
    const my = abiertas.filter(function (a) { return a.responsable === S.yo; }).sort(sortActs);
    mine = '<div class="card" style="margin-bottom:14px"><div class="card-h"><h2>' + icon('star', 18) + ' Mis tareas · ' + esc(S.yo) + '</h2>' +
      '<button class="btn sm" data-act="open-per" data-id="' + esc(S.yo) + '">Ver todas (' + my.length + ')</button></div>' +
      (my.length ? '<div class="task-list">' + my.slice(0, 4).map(taskCard).join('') + '</div>' : emptyBox('No tienes tareas pendientes. ¡Buen trabajo!')) + '</div>';
  }

  const al = alerts();
  const alertsHtml = card('Alertas' + (al.length ? ' <span class="muted small">(' + al.length + ')</span>' : ''),
    al.length ? al.slice(0, 10).map(alertRow).join('') + (al.length > 10 ? '<div class="empty small">y ' + (al.length - 10) + ' más…</div>' : '')
      : '<div class="all-ok">' + icon('check', 22) + ' Todo en orden: no hay tareas atrasadas, falta de stock ni mantenimientos vencidos.</div>');

  const kpis = '<div class="grid kpis">' +
    kpi('Proyectos activos', activos.length, d.proyectos.length + ' en total', '', 'proyectos') +
    kpi('Tareas pendientes', abiertas.length, abiertas.filter(function (a) { return urg(a) === 'week' || urg(a) === 'today'; }).length + ' vencen esta semana', '', 'pendientes') +
    kpi('Tareas atrasadas', vencidas.length, vencidas.length ? 'requieren atención' : 'todo al día', vencidas.length ? 'bad' : 'ok', 'pendientes', ' data-f="Vencidas"') +
    kpi('Cotizaciones por aprobar', cotPend.length, fmtTotals(cotPend), cotPend.length ? 'warn' : '', 'documentos', ' data-tipo="Cotización"') +
    kpi('Órdenes de compra abiertas', ocAbiertas.length, fmtTotals(ocAbiertas), '', 'documentos', ' data-tipo="Orden de compra"') +
    kpi('Facturas por cobrar', factCobrar.length, fmtTotals(factCobrar), factCobrar.length ? 'warn' : '', 'documentos', ' data-tipo="Factura"') +
    '</div>';

  const team = people().filter(function (p) { return p.open.length; }).sort(personSort).slice(0, 6);
  const teamHtml = card('Equipo: quién tiene urgencias', team.length ? team.map(personRow).join('') : emptyBox('Nadie tiene tareas pendientes.'),
    '<button class="btn sm ghost" data-act="nav" data-id="equipo">Ver equipo</button>');

  const projHtml = card('Avance de proyectos', activos.length ? activos.sort(function (a, b) { return (a.fechaFin || '9') < (b.fechaFin || '9') ? -1 : 1; }).map(function (p) {
    const st = currentStage(p.id);
    const late = p.fechaFin && p.fechaFin < h;
    return '<div class="list-item clickable" data-act="open-proj" data-id="' + p.id + '"><div class="grow">' +
      '<div class="row between"><div class="title">' + esc(p.nombre) + '</div><span class="small strong">' + (p.avance || 0) + '%</span></div>' +
      '<div class="meta"><span>' + esc(p.cliente || '—') + '</span>' + (st ? '<span>Etapa: <b>' + esc(st.nombre) + '</b></span>' : '') +
      (p.fechaFin ? '<span' + (late ? ' class="txt-bad"' : '') + '>Entrega ' + fmtDate(p.fechaFin) + '</span>' : '') + '</div>' +
      '<div style="margin-top:6px">' + progress(p.avance) + '</div></div></div>';
  }).join('') : emptyBox('No hay proyectos activos.', actBtn('new-proj', 'Crear proyecto', 'plus', 'primary')),
  '<button class="btn sm ghost" data-act="nav" data-id="proyectos">Ver todos</button>');

  return {
    title: 'Inicio',
    actions: actBtn('new-proj', 'Nuevo proyecto', 'plus', 'primary'),
    body: mine + '<div class="grid two-col">' + alertsHtml + teamHtml + '</div><div class="gap"></div>' + kpis + projHtml
  };
}

/* ---------------- Equipo (tareas por responsable) ---------------- */
function personSort(a, b) {
  if (a.late !== b.late) return b.late - a.late;
  if (a.today !== b.today) return b.today - a.today;
  if (a.week !== b.week) return b.week - a.week;
  if (a.open.length !== b.open.length) return b.open.length - a.open.length;
  return String(a.nombre || 'zzz').localeCompare(String(b.nombre || 'zzz'));
}
function personRow(p) {
  return '<div class="list-item clickable" data-act="open-per" data-id="' + esc(p.nombre) + '">' +
    '<span class="avatar ' + URG_CLASS[p.worst] + '">' + esc(initials(p.nombre)) + '</span>' +
    '<div class="grow"><div class="title">' + esc(p.nombre || 'Sin asignar') + '</div>' +
    '<div class="meta"><span>' + esc(p.rec && p.rec.cargo || '') + '</span><span>' + plural(p.open.length, 'tarea', 'tareas') + '</span></div></div>' +
    countChips(p) + '</div>';
}
function countChips(p) {
  return '<div class="chips">' + (p.late ? pill(p.late + ' atrasada' + (p.late > 1 ? 's' : ''), 'bad') : '') +
    (p.today ? pill(p.today + ' hoy', 'warn') : '') + (p.blocked ? pill(p.blocked + ' con problema', 'bad') : '') +
    (!p.late && !p.today && !p.blocked ? (p.week ? pill(p.week + ' esta semana', 'info') : pill('Al día', 'ok')) : '') + '</div>';
}
function initials(n) {
  if (!n) return '?';
  return n.split(/\s+/).filter(String).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
}
function viewEquipo() {
  const f = S.f, q = f.eq.toLowerCase();
  const list = people().filter(function (p) {
    if (f.efil === 'Con urgencias' && !(p.late || p.today || p.blocked)) return false;
    if (f.efil === 'Con certificación por vencer' && !p.certAlert) return false;
    return !q || [p.nombre, p.rec && p.rec.cargo].join(' ').toLowerCase().indexOf(q) >= 0;
  }).sort(personSort);
  const all = people();
  const urgentes = all.filter(function (p) { return p.late || p.today || p.blocked; }).length;

  const kpis = '<div class="grid kpis">' +
    kpi('Personas', all.filter(function (p) { return p.nombre; }).length, S.data.personal.length + ' registradas', '') +
    kpi('Con urgencias', urgentes, 'atrasadas, hoy o con problema', urgentes ? 'bad' : 'ok', '', ' data-act="efil" data-id="Con urgencias"') +
    kpi('Tareas sin asignar', S.data.actividades.filter(function (a) { return isOpen(a) && !a.responsable; }).length, 'asígnalas a alguien', '', '', ' data-act="open-per" data-id=""') +
    kpi('Certificaciones por vencer', all.filter(function (p) { return p.certAlert; }).length, 'próximos 30 días o vencidas', all.some(function (p) { return p.certAlert; }) ? 'warn' : '', '', ' data-act="efil" data-id="Con certificación por vencer"') +
    '</div>';

  const toolbar = '<div class="toolbar"><input type="search" placeholder="Buscar persona…" data-filter="eq" value="' + esc(f.eq) + '">' +
    select('efil', ['Todos', 'Con urgencias', 'Con certificación por vencer'], f.efil) + '</div>';

  const cards = list.length ? '<div class="grid people-cards">' + list.map(function (p) {
    const next = p.open.slice().sort(sortActs)[0];
    return '<div class="card pcard person ' + URG_CLASS[p.worst] + '" data-act="open-per" data-id="' + esc(p.nombre) + '">' +
      '<div class="row"><span class="avatar ' + URG_CLASS[p.worst] + '">' + esc(initials(p.nombre)) + '</span>' +
      '<div class="grow" style="min-width:0"><h3 class="ellipsis">' + esc(p.nombre || 'Sin asignar') + (S.yo && S.yo === p.nombre ? ' ' + icon('star', 14) : '') + '</h3>' +
      '<div class="meta"><span>' + esc(p.rec && p.rec.cargo || (p.nombre ? 'Sin datos' : 'Tareas sin responsable')) + '</span></div></div></div>' +
      '<div class="counters">' +
      '<div class="cnt ' + (p.late ? 'bad' : '') + '"><b>' + p.late + '</b><span>Atrasadas</span></div>' +
      '<div class="cnt ' + (p.today ? 'warn' : '') + '"><b>' + p.today + '</b><span>Hoy</span></div>' +
      '<div class="cnt ' + (p.week ? 'info' : '') + '"><b>' + p.week + '</b><span>Esta semana</span></div>' +
      '<div class="cnt"><b>' + p.open.length + '</b><span>Total</span></div></div>' +
      (next ? '<div class="small"><span class="muted">Lo más urgente:</span> <b>' + esc(next.titulo) + '</b> · <span class="txt-' + (URG_CLASS[urg(next)] || 'muted') + '">' + dueLabel(next) + '</span></div>'
        : '<div class="small muted">Sin tareas pendientes</div>') +
      (p.blocked ? '<div class="small txt-bad strong">' + icon('alert', 14) + ' ' + plural(p.blocked, 'tarea con problema', 'tareas con problema') + '</div>' : '') +
      (p.certAlert ? '<div class="small txt-' + p.certAlert.cls + '">' + icon('calidad', 14) + ' Certificación: ' + esc(p.certAlert.t) + '</div>' : '') +
      '</div>';
  }).join('') + '</div>' : '<div class="card">' + emptyBox('No hay personas con estos filtros.', actBtn('new-per', 'Agregar persona', 'plus', 'primary')) + '</div>';

  return { title: 'Equipo', actions: actBtn('new-per', 'Agregar persona', 'plus', 'primary'), body: kpis + toolbar + cards };
}

function viewPersona() {
  const name = S.per || '';
  const p = people().find(function (x) { return x.nombre === name; }) ||
    { nombre: name, rec: personRecord(name), acts: [], open: [], late: 0, today: 0, week: 0, blocked: 0, certs: [], worst: 'done' };
  const rec = p.rec;
  const isYo = S.yo && S.yo === name;
  const certs = rec ? S.data.certificaciones.filter(function (c) { return c.personalId === rec.id; }) : [];
  const done = p.acts.filter(function (a) { return !isOpen(a); }).sort(function (a, b) { return (a.completadoEn || a.actualizado) > (b.completadoEn || b.actualizado) ? -1 : 1; });

  const head = '<div class="card" style="margin-bottom:14px"><div class="card-b"><div class="row" style="flex-wrap:wrap;gap:12px">' +
    '<span class="avatar lg ' + URG_CLASS[p.worst] + '">' + esc(initials(name)) + '</span>' +
    '<div class="grow" style="min-width:0"><div class="meta"><span>' + esc(rec && rec.cargo || (name ? 'Sin datos registrados' : 'Tareas que no tienen responsable')) + '</span>' +
    (rec && rec.telefono ? '<span>Tel: <b class="selectable">' + esc(rec.telefono) + '</b></span>' : '') + '</div>' + countChips(p) + '</div>' +
    (name ? '<button class="btn ' + (isYo ? 'primary' : '') + '" data-act="yo" data-id="' + esc(name) + '">' + icon('star', 16) + (isYo ? 'Eres tú' : 'Soy yo') + '</button>' : '') +
    '</div>' + (name && !isYo ? '<div class="hint">Si esta es tu cuenta, toca <b>«Soy yo»</b>: tus tareas aparecerán primero en Inicio.</div>' : '') + '</div></div>';

  const tabs = '<div class="tabs">' + [['tareas', 'Tareas pendientes (' + p.open.length + ')'], ['hechas', 'Terminadas (' + done.length + ')']]
    .concat(name ? [['certs', 'Certificaciones (' + certs.length + ')']] : [])
    .map(function (t) { return '<button data-act="pertab" data-id="' + t[0] + '" class="' + (S.pertab === t[0] ? 'active' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>';

  let body = '';
  if (S.pertab === 'tareas') {
    const groups = [['late', 'Atrasadas'], ['today', 'Para hoy'], ['week', 'Esta semana'], ['later', 'Más adelante'], ['none', 'Sin fecha']];
    body = groups.map(function (g) {
      const items = p.open.filter(function (a) { return urg(a) === g[0]; }).sort(sortActs);
      if (!items.length) return '';
      return '<h3 class="group-h txt-' + (URG_CLASS[g[0]] || 'muted') + '">' + g[1] + ' <span class="muted small">(' + items.length + ')</span></h3>' +
        '<div class="task-list">' + items.map(taskCard).join('') + '</div>';
    }).join('') || '<div class="card">' + emptyBox('No hay tareas pendientes.', actBtn('new-act', 'Nueva tarea', 'plus', 'primary', '', ' data-resp="' + esc(name) + '"')) + '</div>';
  } else if (S.pertab === 'hechas') {
    body = done.length ? '<div class="card">' + done.slice(0, 40).map(function (a) { return actRow(a, true); }).join('') + '</div>' : '<div class="card">' + emptyBox('Aún no hay tareas terminadas.') + '</div>';
  } else {
    body = rec ? '<div class="row between" style="margin-bottom:10px"><span class="muted small">Homologaciones de soldador: proceso, norma, posición y vencimiento.</span>' +
      actBtn('new-cert', 'Certificación', 'plus', 'sm primary', rec.id) + '</div>' +
      (certs.length ? '<div class="card">' + certs.map(certRow).join('') + '</div>' : '<div class="card">' + emptyBox('Sin certificaciones registradas.') + '</div>')
      : '<div class="card">' + emptyBox('Para guardar certificaciones, primero registra a ' + esc(name) + ' en el equipo.', actBtn('new-per', 'Registrar a ' + esc(name), 'plus', 'primary', '', ' data-nombre="' + esc(name) + '"')) + '</div>';
  }

  return {
    title: backTitle(name || 'Sin asignar', 'equipo'),
    actions: actBtn('new-act', 'Nueva tarea', 'plus', 'primary', '', ' data-resp="' + esc(name) + '"') + (rec ? actBtn('edit-per', 'Editar', 'edit', '', rec.id) : ''),
    body: head + tabs + body
  };
}

/** Tarjeta grande de tarea con botones simples. */
function taskCard(a) {
  const p = proj(a.proyectoId), et = byId('etapas', a.etapaId), u = urg(a);
  return '<div class="task ' + URG_CLASS[u] + '">' +
    '<div class="task-top"><div class="grow" style="min-width:0"><div class="task-title">' + esc(a.titulo) + '</div>' +
    '<div class="meta">' + (p ? '<span class="strong txt-primary">' + esc(p.nombre) + '</span>' : '') + (et ? '<span>' + esc(et.nombre) + '</span>' : '') +
    (S.view !== 'persona' && a.responsable ? '<span>' + esc(a.responsable) + '</span>' : '') + '</div></div>' +
    '<button class="icon-btn" data-act="edit-act" data-id="' + a.id + '" title="Editar" aria-label="Editar tarea">' + icon('edit') + '</button></div>' +
    '<div class="chips">' + pill(dueLabel(a), URG_CLASS[u]) + prioPill(a.prioridad) +
    (a.estado === 'En curso' ? pill('Trabajando', 'info') : '') + (a.estado === 'Bloqueada' ? pill('Con problema', 'bad') : '') + '</div>' +
    (a.estado === 'Bloqueada' && a.notas ? '<div class="small txt-bad">' + esc(String(a.notas).split('\n').pop()) + '</div>' : '') +
    '<div class="task-btns">' +
    (a.estado !== 'En curso' ? '<button class="btn big" data-act="start-act" data-id="' + a.id + '">' + icon('play', 16) + 'Empezar</button>' : '') +
    '<button class="btn big ok" data-act="done-act" data-id="' + a.id + '">' + icon('check', 18) + 'Terminé</button>' +
    '<button class="btn big warn" data-act="prob-act" data-id="' + a.id + '">' + icon('alert', 16) + 'Problema</button>' +
    '</div></div>';
}
function certRow(c) {

    '<div class="meta">' + (c.numero ? '<span>N° ' + esc(c.numero) + '</span>' : '') + (c.emision ? '<span>Emitida ' + fmtDate(c.emision) + '</span>' : '') +
    '</div></div>' + pill(s.t, s.cls) +
    (c.archivoUrl ? '<a class="btn sm" href="' + esc(c.archivoUrl) + '" target="_blank" rel="noopener">' + icon('file', 14) + 'Ver</a>' : '') + '</div>';
}

/* ---------------- Proyectos ---------------- */
function viewProyectos() {
  const f = S.f, q = f.pq.toLowerCase();
  const list = S.data.proyectos.filter(function (p) {
    if (f.pestado === 'Activos' && !projActive(p)) return false;
    if (f.pestado !== 'Activos' && f.pestado !== 'Todos' && p.estado !== f.pestado) return false;
    return !q || [p.nombre, p.cliente, p.codigo, p.responsable].join(' ').toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) { return a.creado > b.creado ? -1 : 1; });

  const toolbar = '<div class="toolbar"><input type="search" placeholder="Buscar proyecto, cliente, código…" data-filter="pq" value="' + esc(f.pq) + '">' +
    select('pestado', ['Activos', 'Todos'].concat(PROJECT_STATES), f.pestado) + '</div>';

  const cards = list.length ? '<div class="grid project-cards">' + list.map(function (p) {
    const acts = actsOf(p.id), st = stagesOf(p.id), cur = currentStage(p.id);
    const pend = acts.filter(isOpen).length, venc = acts.filter(isOverdue).length;
    return '<div class="card pcard" data-act="open-proj" data-id="' + p.id + '">' +
      '<div class="row between"><span class="code">' + esc(p.codigo) + '</span>' + pill(p.estado) + '</div>' +
      '<h3>' + esc(p.nombre) + '</h3>' +
      '<div class="meta"><span>' + esc(p.cliente || 'Sin cliente') + '</span>' + (p.responsable ? '<span>' + esc(p.responsable) + '</span>' : '') + '</div>' +
      (st.length ? '<div class="pipeline">' + st.map(function (e) {
        return '<span class="' + (e.estado === 'Completada' ? 'past' : (cur === e ? 'cur' : '')) + '">' + esc(e.nombre) + '</span>';
      }).join('') + '</div>' : '') +
      '<div class="row"><div style="flex:1">' + progress(p.avance) + '</div><span class="small strong">' + (p.avance || 0) + '%</span></div>' +
      '<div class="meta"><span>' + plural(pend, 'pendiente', 'pendientes') + '</span>' +
      (venc ? '<span class="txt-bad strong">' + plural(venc, 'atrasada', 'atrasadas') + '</span>' : '') +
      '<span>' + docsOf(p.id).length + ' doc.</span>' + (p.fechaFin ? '<span>Entrega ' + fmtDate(p.fechaFin) + '</span>' : '') + '</div>' +
      '</div>';
  }).join('') + '</div>' : '<div class="card">' + emptyBox('No hay proyectos que coincidan.', actBtn('new-proj', 'Crear proyecto', 'plus', 'primary')) + '</div>';

  return { title: 'Proyectos', actions: actBtn('new-proj', 'Nuevo proyecto', 'plus', 'primary'), body: toolbar + cards };
}

function viewProyecto() {
  const p = proj(S.pid);
  if (!p) { S.view = 'proyectos'; return viewProyectos(); }
  const acts = actsOf(p.id), docs = docsOf(p.id), st = stagesOf(p.id);
  const insp = S.data.inspecciones.filter(function (i) { return i.proyectoId === p.id; });
  const movs = S.data.movimientos.filter(function (m) { return m.proyectoId === p.id; });
  const pend = acts.filter(isOpen).length, venc = acts.filter(isOverdue).length;
  const horas = acts.reduce(function (s, a) { return s + (Number(a.horas) || 0); }, 0);
  const sum = function (tipo, estados, neg) {
    return fmtTotals(docs.filter(function (x) {
      return x.tipo === tipo && (neg ? estados.indexOf(x.estado) < 0 : estados.indexOf(x.estado) >= 0);
    }));
  };

  const info = '<div class="card" style="margin-bottom:14px"><div class="card-b">' +
    '<div class="row between" style="flex-wrap:wrap;gap:8px"><div style="min-width:0"><span class="muted small strong">' + esc(p.codigo) + '</span>' +
    '<div class="meta" style="margin-top:4px"><span>Cliente: <b>' + esc(p.cliente || '—') + '</b></span>' +
    '<span>Responsable: <b>' + esc(p.responsable || '—') + '</b></span>' +
    '<span>' + (p.fechaInicio ? fmtDate(p.fechaInicio) : '¿inicio?') + ' → ' + (p.fechaFin ? fmtDate(p.fechaFin) : '¿entrega?') + '</span>' +
    (p.presupuesto ? '<span>Presupuesto: <b>' + fmtMoney(p.presupuesto, p.moneda) + '</b></span>' : '') +
    (horas ? '<span>Horas hombre: <b>' + fmtNum(horas) + ' h</b></span>' : '') + '</div></div>' +
    '<select data-act-change="proj-estado" data-id="' + p.id + '" class="pill ' + stateClass(p.estado) + '" style="border:0;padding:6px 10px" aria-label="Estado del proyecto">' +
    PROJECT_STATES.map(function (s) { return '<option' + (s === p.estado ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
    (p.descripcion ? '<p class="small" style="margin:10px 0 0;white-space:pre-wrap">' + esc(p.descripcion) + '</p>' : '') +
    '<div class="row" style="margin-top:12px"><div style="flex:1">' + progress(p.avance) + '</div><b>' + (p.avance || 0) + '%</b></div>' +
    '<div class="meta" style="margin-top:6px"><span>' + plural(pend, 'tarea pendiente', 'tareas pendientes') + '</span>' +
    (venc ? '<span class="txt-bad strong">' + plural(venc, 'atrasada', 'atrasadas') + '</span>' : '') + '</div>' +
    '</div></div>';

  const fin = '<div class="grid kpis">' +
    kpi('Cotizado (aprobado)', '<span class="v-sm">' + sum('Cotización', ['Aprobada']) + '</span>', docs.filter(function (x) { return x.tipo === 'Cotización'; }).length + ' cotizaciones', '') +
    kpi('Órdenes de compra', '<span class="v-sm">' + sum('Orden de compra', ['Anulada'], true) + '</span>', docs.filter(function (x) { return x.tipo === 'Orden de compra'; }).length + ' órdenes', '') +
    kpi('Facturado', '<span class="v-sm">' + sum('Factura', ['Anulada'], true) + '</span>', 'Pagado: ' + sum('Factura', ['Pagada']), '') +
    '</div>';

  const tabs = '<div class="tabs">' + [['etapas', 'Etapas y tareas'], ['documentos', 'Documentos (' + docs.length + ')'],
    ['materiales', 'Materiales (' + movs.length + ')'], ['calidad', 'Calidad (' + insp.length + ')'], ['historial', 'Historial']]
    .map(function (t) { return '<button data-act="ptab" data-id="' + t[0] + '" class="' + (S.ptab === t[0] ? 'active' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>';

  let body = '';
  if (S.ptab === 'etapas') body = tabEtapas(p, st, acts);
  else if (S.ptab === 'documentos') body = tabDocs(p, docs);
  else if (S.ptab === 'materiales') body = tabMateriales(p, movs);
  else if (S.ptab === 'calidad') body = '<div class="row between" style="margin-bottom:10px"><span class="muted small">Inspecciones de soldadura y control dimensional de este proyecto.</span>' +
    actBtn('new-insp', 'Inspección', 'plus', 'sm primary', p.id) + '</div>' +
    (insp.length ? '<div class="card">' + insp.sort(function (a, b) { return a.fecha > b.fecha ? -1 : 1; }).map(function (i) { return inspRow(i, false); }).join('') + '</div>' : '<div class="card">' + emptyBox('Sin inspecciones registradas.') + '</div>');
  else body = tabHistorial();

  return {
    title: backTitle(p.nombre, 'proyectos'),
    actions: actBtn('edit-proj', 'Editar', 'edit', '', p.id) + actBtn('del-proj', 'Eliminar', 'trash', 'danger', p.id),
    body: info + fin + tabs + body,
    after: S.ptab === 'historial' && !S.hist ? function () {
      api('getHistorial', p.id).then(function (h) { S.hist = h; if (S.view === 'proyecto' && S.ptab === 'historial') render(); });
    } : null
  };
}

function tabEtapas(p, st, acts) {
  const strip = st.length ? '<div class="stages-strip">' + st.map(function (e, i) {
    const cls = e.estado === 'Completada' ? 'ok' : e.estado === 'En curso' ? 'info' : e.estado === 'Bloqueada' ? 'bad' : '';
    return '<div class="stage-chip ' + cls + '"><div class="n">' + (i + 1) + '. ' + esc(e.nombre) + '</div>' + esc(e.estado) + ' · ' + (e.avance || 0) + '%</div>';
  }).join('') + '</div>' : '';

  const stageCard = function (e, i, list) {
    const ea = acts.filter(function (a) { return e ? a.etapaId === e.id : !a.etapaId || !st.some(function (s) { return s.id === a.etapaId; }); })
      .sort(sortActs);
    if (!e && !ea.length) return '';
    const head = e ?
      '<div class="stage-num ' + (e.estado === 'Completada' ? 'ok' : '') + '">' + (e.estado === 'Completada' ? '✓' : i + 1) + '</div>' +
      '<div style="flex:1;min-width:0"><div class="row" style="flex-wrap:wrap;gap:6px"><b>' + esc(e.nombre) + '</b>' + pill(e.estado) + '</div>' +
      '<div class="meta">' + (e.fechaInicio || e.fechaFin ? '<span>' + fmtDate(e.fechaInicio) + ' → ' + fmtDate(e.fechaFin) + '</span>' : '') +
      '<span>' + ea.filter(function (a) { return a.estado === 'Completada'; }).length + '/' + ea.filter(function (a) { return a.estado !== 'Cancelada'; }).length + ' tareas</span></div></div>' +
      '<button class="icon-btn hide-m" data-act="up-stage" data-id="' + e.id + '" title="Subir" aria-label="Subir etapa"' + (i === 0 ? ' disabled' : '') + '>' + icon('up') + '</button>' +
      '<button class="icon-btn hide-m" data-act="down-stage" data-id="' + e.id + '" title="Bajar" aria-label="Bajar etapa"' + (i === list.length - 1 ? ' disabled' : '') + '>' + icon('down') + '</button>' +
      '<button class="icon-btn" data-act="edit-stage" data-id="' + e.id + '" title="Editar etapa" aria-label="Editar etapa">' + icon('edit') + '</button>'
      : '<div class="stage-num">–</div><div style="flex:1"><b>Sin etapa</b></div>';
    return '<div class="card stage"><div class="stage-h">' + head + '</div>' +
      (e ? '<div style="padding:0 16px">' + progress(e.avance) + '</div>' : '') +
      (ea.length ? ea.map(function (a) { return actRow(a, false); }).join('') : '<div class="empty small">Sin tareas en esta etapa.</div>') +
      '<div style="padding:10px 16px"><button class="btn sm" data-act="new-act" data-id="' + p.id + '" data-etapa="' + (e ? e.id : '') + '">' + icon('plus', 14) + 'Tarea</button></div></div>';
  };

  return '<div class="row between" style="margin-bottom:10px"><span class="muted small">' + st.length + ' etapas</span>' +
    '<div class="row">' + actBtn('new-act', 'Tarea', 'plus', 'sm', p.id, ' data-etapa=""') + actBtn('new-stage', 'Etapa', 'plus', 'sm primary', p.id) + '</div></div>' +
    strip + (st.length ? st.map(stageCard).join('') : '<div class="card">' + emptyBox('Este proyecto aún no tiene etapas. Crea la primera con «+ Etapa».') + '</div>') +
    stageCard(null, 0, []);
}

function actRow(a, showProject) {
  const done = a.estado === 'Completada';
  const p = showProject ? proj(a.proyectoId) : null;
  const et = showProject ? byId('etapas', a.etapaId) : null;
  const u = urg(a);
  return '<div class="list-item' + (done || a.estado === 'Cancelada' ? ' done' : '') + '">' +
    '<button class="check' + (done ? ' on' : '') + '" data-act="toggle-act" data-id="' + a.id + '" title="' + (done ? 'Marcar pendiente' : 'Marcar terminada') + '" aria-label="' + (done ? 'Marcar pendiente' : 'Marcar terminada') + '">' + (done ? '✓' : '') + '</button>' +
    '<div class="grow clickable" data-act="edit-act" data-id="' + a.id + '"><div class="title">' + esc(a.titulo) + '</div>' +
    '<div class="meta">' + (p ? '<span class="strong txt-primary">' + esc(p.nombre) + (et ? ' · ' + esc(et.nombre) : '') + '</span>' : '') +
    '<span>' + (a.responsable ? esc(a.responsable) : '<i>Sin asignar</i>') + '</span>' +
    (a.fechaLimite || isOpen(a) ? '<span class="txt-' + (URG_CLASS[u] || 'muted') + (u === 'late' || u === 'today' ? ' strong' : '') + '">' + dueLabel(a) + '</span>' : '') +
    (a.horas ? '<span>' + fmtNum(a.horas) + ' h</span>' : '') + '</div></div>' +
    '<div class="chips">' + prioPill(a.prioridad) + (a.estado === 'En curso' ? pill('Trabajando', 'info') : a.estado === 'Bloqueada' ? pill('Con problema', 'bad') : '') + '</div></div>';
}

function docPipeline(d) {
  const steps = DOC_TYPES[d.tipo] || [];
  const bad = BAD_DOC.indexOf(d.estado) >= 0;
  const visible = steps.filter(function (s) { return BAD_DOC.indexOf(s) < 0 || s === d.estado; });
  const ci = visible.indexOf(d.estado);
  return '<div class="pipeline">' + visible.map(function (s, i) {
    return '<span class="' + (i === ci ? 'cur' + (bad ? ' bad' : '') : i < ci ? 'past' : '') + '">' + esc(s) + '</span>';
  }).join('') + '</div>';
}
function docRow(d, showProject) {
  const p = showProject ? proj(d.proyectoId) : null;
  const ref = d.referenciaId ? byId('documentos', d.referenciaId) : null;
  return '<div class="list-item"><div class="grow clickable" data-act="edit-doc" data-id="' + d.id + '">' +
    '<div class="row" style="gap:8px;flex-wrap:wrap"><span class="title">' + esc(d.tipo) + (d.numero ? ' N° ' + esc(d.numero) : '') + '</span>' + pill(d.estado) + '</div>' +
    '<div class="meta">' + (p ? '<span class="strong txt-primary">' + esc(p.nombre) + '</span>' : '') +
    (d.contraparte ? '<span>' + esc(d.contraparte) + '</span>' : '') + (d.fecha ? '<span>' + fmtDate(d.fecha) + '</span>' : '') +
    (ref ? '<span>Ref: ' + esc(ref.tipo) + ' ' + esc(ref.numero) + '</span>' : '') + '</div>' +
    docPipeline(d) + '</div>' +
    '<div style="text-align:right"><div class="strong num">' + (d.monto !== '' && d.monto !== undefined ? fmtMoney(d.monto, d.moneda) : '') + '</div>' +
    (d.archivoUrl ? '<a class="btn sm" style="margin-top:6px" href="' + esc(d.archivoUrl) + '" target="_blank" rel="noopener">' + icon('file', 14) + 'Ver</a>' : '') +
    '</div></div>';
}
function tabDocs(p, docs) {
  const groups = Object.keys(DOC_TYPES).map(function (t) {
    const list = docs.filter(function (d) { return d.tipo === t; }).sort(function (a, b) { return (a.fecha || '') > (b.fecha || '') ? -1 : 1; });
    if (!list.length) return '';
    return '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>' + esc(docTypePlural(t)) +
      '</h3><span class="muted small">' + (t === 'Plano' ? '' : fmtTotals(list.filter(function (d) { return BAD_DOC.indexOf(d.estado) < 0; }))) + '</span></div>' +
      list.map(function (d) { return docRow(d, false); }).join('') + '</div>';
  }).join('');
  return '<div class="row between" style="margin-bottom:10px"><span class="muted small">Cotizaciones, órdenes de compra, facturas y planos (PDF, foto, Excel…)</span>' +
    actBtn('new-doc', 'Documento', 'plus', 'sm primary', p.id) + '</div>' +
    (groups || '<div class="card">' + emptyBox('Aún no hay documentos en este proyecto.') + '</div>');
}
function docTypePlural(t) { return { 'Cotización': 'Cotizaciones', 'Orden de compra': 'Órdenes de compra', 'Factura': 'Facturas', 'Plano': 'Planos', 'Otro': 'Otros' }[t] || t; }
function tabMateriales(p, movs) {
  const salidas = movs.filter(function (m) { return m.tipo === 'Salida'; });
  const by = {};
  salidas.forEach(function (m) { by[m.materialId] = (by[m.materialId] || 0) + (Number(m.cantidad) || 0); });
  const resumen = Object.keys(by).map(function (id) {
    const m = byId('materiales', id) || { nombre: '(material eliminado)', unidad: '' };
    return '<tr><td>' + esc(m.nombre) + '</td><td class="num">' + fmtNum(by[id]) + ' ' + esc(m.unidad) + '</td></tr>';
  }).join('');
  return '<div class="row between" style="margin-bottom:10px"><span class="muted small">Material que salió del almacén para este proyecto.</span>' +
    actBtn('new-mov', 'Salida de material', 'out', 'sm primary', '', ' data-tipo="Salida" data-proy="' + p.id + '"') + '</div>' +
    (resumen ? '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Consumo total</h3></div><div class="table-wrap"><table class="t"><thead><tr><th>Material</th><th class="num">Cantidad</th></tr></thead><tbody>' + resumen + '</tbody></table></div></div>' : '') +
    (movs.length ? '<div class="card">' + movs.slice().reverse().map(movRow).join('') + '</div>' : '<div class="card">' + emptyBox('Todavía no se registró material para este proyecto.') + '</div>');
}
function tabHistorial() {
  if (!S.hist) return '<div class="card loading">Cargando historial…</div>';
  if (!S.hist.length) return '<div class="card">' + emptyBox('Sin movimientos registrados.') + '</div>';
  return '<div class="card">' + S.hist.map(function (h) {
    return '<div class="list-item"><div class="grow"><div><b>' + esc(h.entidad) + '</b> · ' + esc(h.accion) + '</div>' +
      '<div class="meta"><span>' + esc(h.detalle) + '</span><span>' + fmtDateTime(h.fecha) + '</span>' + (h.usuario ? '<span>' + esc(h.usuario) + '</span>' : '') + '</div></div></div>';
  }).join('') + '</div>';
}

/* ---------------- Tareas (todas) ---------------- */
function viewPendientes() {
  const f = S.f, q = f.aq.toLowerCase();
  const list = S.data.actividades.filter(function (a) {
    if (f.aest === 'Abiertas' && !isOpen(a)) return false;
    if (f.aest === 'Vencidas' && !isOverdue(a)) return false;
    if (['Abiertas', 'Vencidas', 'Todas'].indexOf(f.aest) < 0 && a.estado !== f.aest) return false;
    if (f.aproy && a.proyectoId !== f.aproy) return false;
    if (f.aresp === '(sin asignar)' && a.responsable) return false;
    if (f.aresp && f.aresp !== '(sin asignar)' && a.responsable !== f.aresp) return false;
    const p = proj(a.proyectoId);
    return !q || [a.titulo, a.responsable, a.notas, p && p.nombre].join(' ').toLowerCase().indexOf(q) >= 0;
  }).sort(sortActs);

  const buckets = [['late', 'Atrasadas'], ['today', 'Vencen hoy'], ['week', 'Próximos 7 días'], ['later', 'Más adelante'], ['none', 'Sin fecha'], ['done', 'Cerradas']];
  const projs = S.data.proyectos.slice().sort(sortByName);
  const resps = personNames();
  const toolbar = '<div class="toolbar"><input type="search" placeholder="Buscar tarea…" data-filter="aq" value="' + esc(f.aq) + '">' +
    select('aest', ['Abiertas', 'Vencidas', 'Todas'].concat(ACT_STATES), f.aest, ['Pendientes', 'Atrasadas', 'Todas', 'Pendiente', 'En curso (trabajando)', 'Bloqueada (con problema)', 'Completada', 'Cancelada']) +
    select('aproy', [''].concat(projs.map(function (p) { return p.id; })), f.aproy, ['Todos los proyectos'].concat(projs.map(function (p) { return p.nombre; }))) +
    select('aresp', ['', '(sin asignar)'].concat(resps), f.aresp, ['Todos los responsables', 'Sin asignar'].concat(resps)) + '</div>';

  const body = buckets.map(function (b) {
    const items = list.filter(function (a) { return urg(a) === b[0]; });
    if (!items.length) return '';
    return '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3 class="txt-' + (URG_CLASS[b[0]] || '') + '">' +
      b[1] + ' <span class="muted small">(' + items.length + ')</span></h3></div>' + items.map(function (a) { return actRow(a, true); }).join('') + '</div>';
  }).join('');

  return {
    title: 'Tareas',
    actions: S.data.proyectos.length ? actBtn('new-act', 'Nueva tarea', 'plus', 'primary', f.aproy || '', ' data-etapa=""') : '',
    body: toolbar + (body || '<div class="card">' + emptyBox('No hay tareas con estos filtros. ¡Todo al día!') + '</div>')
  };
}

/* ---------------- Documentos ---------------- */
function viewDocumentos() {
  const f = S.f, q = f.dq.toLowerCase();
  const list = S.data.documentos.filter(function (d) {
    if (f.dtipo && d.tipo !== f.dtipo) return false;
    if (f.dest === 'En trámite' && (BAD_DOC.indexOf(d.estado) >= 0 || DONE_DOC.indexOf(d.estado) >= 0)) return false;

/* ---------------- Formularios / modal ---------------- */
function field(fd, value) {
  const v = value === undefined || value === null ? '' : value;
  const req = fd.required ? ' required' : '';
  const id = 'f-' + fd.name;
  const help = fd.help ? '<small class="help-txt">' + fd.help + '</small>' : '';
  let input;
  if (fd.type === 'select') {
    input = '<select id="' + id + '" name="' + fd.name + '"' + req + '>' + fd.options.map(function (o) {
      const val = typeof o === 'object' ? o.v : o, lab = typeof o === 'object' ? o.l : o;
      return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(lab) + '</option>';
    }).join('') + '</select>';
  } else if (fd.type === 'textarea') {
    input = '<textarea id="' + id + '" name="' + fd.name + '"' + req + (fd.placeholder ? ' placeholder="' + esc(fd.placeholder) + '"' : '') + '>' + esc(v) + '</textarea>';
  } else if (fd.type === 'checkbox') {
    return '<label class="check-label ' + (fd.full ? 'full' : '') + '"><input id="' + id + '" type="checkbox" name="' + fd.name + '"' + (v ? ' checked' : '') + '>' + esc(fd.label) + '</label>';
  } else if (fd.type === 'file') {
    return '<div class="full"><div class="lbl-txt">' + esc(fd.label) + '</div>' +
      '<label class="drop" id="drop"><input id="' + id + '" type="file" name="' + fd.name + '" style="display:none" accept="' + (fd.accept || '.pdf,image/*,.xls,.xlsx,.doc,.docx,.csv,.zip,.dwg') + '">' +
      '<span id="drop-txt">' + (v ? 'Archivo actual: <b>' + esc(v) + '</b><br>Toca para reemplazarlo' : 'Toca para elegir un archivo o tomar una foto') + '</span></label></div>';
  } else if (fd.type === 'note') {
    return '<div class="full hint">' + fd.label + '</div>';
  } else {
    input = '<input id="' + id + '" type="' + (fd.type || 'text') + '" name="' + fd.name + '" value="' + esc(v) + '"' + req +
      (fd.type === 'number' ? ' step="any" min="0" inputmode="decimal"' : '') + (fd.type === 'tel' ? ' inputmode="tel"' : '') +
      (fd.placeholder ? ' placeholder="' + esc(fd.placeholder) + '"' : '') + '>';
  }
  return '<label class="' + (fd.full ? 'full' : '') + '" for="' + id + '"><span>' + esc(fd.label) + (fd.required ? ' *' : '') + '</span>' + input + help + '</label>';
}
function formValues(form) {
  const o = {};
  Array.prototype.forEach.call(form.elements, function (el) {
    if (!el.name || el.type === 'file') return;
    o[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return o;
}

function readFile(f) {
  if (!f) return Promise.resolve(null);
  if (f.size > 40 * 1024 * 1024) return Promise.reject(new Error('El archivo es muy grande (más de 40 MB)'));
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { resolve({ name: f.name, mimeType: f.type, data: String(r.result).split(',')[1] }); };
    r.onerror = function () { reject(new Error('No se pudo leer el archivo')); };
    r.readAsDataURL(f);
  });
}

  });
}

/* ---------------- Botón + y menú Más ---------------- */
function quickMenu() {
  openMenu('¿Qué quieres registrar?', [
    { ic: 'task', l: 'Nueva tarea', d: 'Asignar trabajo a alguien', act: 'new-act', extra: ' data-resp=""' },
    { ic: 'out', l: 'Salida de material', d: 'Sacar del almacén', act: 'new-mov', extra: ' data-tipo="Salida"' },
    { ic: 'in', l: 'Entrada de material', d: 'Llegó una compra', act: 'new-mov', extra: ' data-tipo="Entrada"' },
    { ic: 'calidad', l: 'Nueva inspección', d: 'Control de soldadura', act: 'new-insp' },
    { ic: 'documentos', l: 'Subir documento', d: 'Cotización, OC, factura, plano', act: 'new-doc' },
    { ic: 'proyectos', l: 'Nuevo proyecto', d: 'Orden de trabajo', act: 'new-proj' }
  ]);
}
function masMenu() {
  openMenu('Más secciones', ['documentos', 'almacen', 'calidad', 'maquinas', 'ajustes', 'ayuda'].map(function (id) {
    const n = NAV.find(function (x) { return x.id === id; });
    return { ic: id, l: n.label, act: 'nav', id: id };
  }));
}

/* ---------------- Eventos ---------------- */
function findAct(id) { return byId('actividades', id); }
const ACTIONS = {
  'nav': function (id, el) {
    if (el.dataset.tipo) { S.f.dtipo = el.dataset.tipo; S.f.dest = ''; }
    if (el.dataset.f) { S.f.aest = el.dataset.f; S.f.aproy = ''; S.f.aresp = ''; }
    else if (id === 'pendientes' && el.closest('.kpi, .alert-row')) { S.f.aest = 'Abiertas'; }
    if (el.dataset.arg) return go(id, el.dataset.arg);
    go(id);
  },
  'menu-mas': masMenu,
  'fab': quickMenu,
  'open-proj': function (id) { go('proyecto', id); },
  'open-per': function (id, el) { go('persona', id); if (el.dataset.tab) { S.pertab = el.dataset.tab; render(); } },
  'ptab': function (id) { S.ptab = id; render(); },
  'pertab': function (id) { S.pertab = id; render(); },
  'atab': function (id) { S.atab = id; S.view = 'almacen'; render(); },
  'efil': function (id) { S.f.efil = id; render(); },
  'mfil': function (id) { S.f.mfil = id; S.atab = 'materiales'; render(); },
  'ires': function (id) { S.f.ires = id; render(); },
  'dtipo': function (id) { S.f.dtipo = id; S.f.dest = ''; render(); },
  'yo': function (id) {
    if (S.yo === id) { setYo(''); toast('Listo, ya no estás marcado'); }
    else { setYo(id); toast('Hola ' + id + ': tus tareas aparecerán en Inicio'); }
    render();
  },
  'login': function () { window.DB && window.DB.login(); },
  'logout': function () { if (window.DB) { setYo(''); window.DB.logout(); } },
  'reload': function () { location.reload(); },
  'new-proj': function () { formProyecto(null); },
  'edit-proj': function (id) { formProyecto(proj(id)); },
  'del-proj': function (id) {
    const p = proj(id);
    if (confirm('¿Eliminar el proyecto «' + p.nombre + '» con todas sus etapas, tareas, inspecciones y registros de documentos?\n(Los archivos permanecen en Google Drive.)')) {
      mutate('deleteProyecto', [id], 'Proyecto eliminado').then(function (ok) { if (ok) go('proyectos'); });
    }
  },
  'new-stage': function (id) { formEtapa(id, null); },
  'edit-stage': function (id) { const e = byId('etapas', id); formEtapa(e.proyectoId, e); },
  'up-stage': function (id) { mutate('moveEtapa', [id, -1]); },
  'down-stage': function (id) { mutate('moveEtapa', [id, 1]); },
  'new-act': function (id, el) { formActividad(id || (S.view === 'proyecto' ? S.pid : ''), el.dataset.etapa, null, el.dataset.resp !== undefined ? el.dataset.resp : (S.view === 'persona' ? S.per : '')); },
  'edit-act': function (id) { const a = findAct(id); if (a) formActividad(a.proyectoId, a.etapaId, a); },
  'toggle-act': function (id) {
    const a = findAct(id);
    const nuevo = a.estado === 'Completada' ? 'Pendiente' : 'Completada';
    a.estado = nuevo; render(); // respuesta inmediata
    mutate('setEstadoActividad', [id, nuevo], nuevo === 'Completada' ? 'Tarea terminada ✓' : 'Tarea reabierta', true);
  },
  'start-act': function (id) { const a = findAct(id); a.estado = 'En curso'; render(); mutate('setEstadoActividad', [id, 'En curso'], 'Marcada como «trabajando»', true); },
  'done-act': function (id) { const a = findAct(id); a.estado = 'Completada'; render(); mutate('setEstadoActividad', [id, 'Completada'], '¡Tarea terminada! ✓', true); },
  'prob-act': function (id) { formProblema(findAct(id)); },
  'new-doc': function (id) { formDocumento(id || (S.view === 'proyecto' ? S.pid : ''), null); },
  'edit-doc': function (id) { const d = byId('documentos', id); formDocumento(d.proyectoId, d); },
  'new-per': function (id, el) { formPersona(null, el.dataset.nombre); },
  'edit-per': function (id) { formPersona(byId('personal', id)); },
  'new-cert': function (id) { formCert(id, null); },
  'edit-cert': function (id) { const c = byId('certificaciones', id); formCert(c.personalId, c); },
  'new-mat': function () { formMaterial(null); },
  'edit-mat': function (id) { formMaterial(byId('materiales', id)); },
  'new-mov': function (id, el) { formMovimiento(el.dataset.tipo, id, el.dataset.proy || ''); },
  'new-insp': function (id) { formInspeccion(id || (S.view === 'proyecto' ? S.pid : ''), null); },
  'edit-insp': function (id) { const i = byId('inspecciones', id); formInspeccion(i.proyectoId, i); },
  'new-eq': function () { formEquipo(null); },
  'edit-eq': function (id) { formEquipo(byId('equipos', id)); },
  'mant-eq': function (id) { formMantenimiento(byId('equipos', id)); }
};
document.addEventListener('click', function (ev) {
  if (ev.target.closest('a[href]')) return;
  const el = ev.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) {
    ev.preventDefault();
    if (el.closest('#modal-root') && !el.closest('form')) closeModal();
    fn(el.dataset.id, el);
  }
});
document.addEventListener('input', function (ev) {
  const k = ev.target.dataset && ev.target.dataset.filter;
  if (!k || ev.target.tagName !== 'INPUT') return;
  S.f[k] = ev.target.value;
  clearTimeout(S._ft);
  S._ft = setTimeout(function () {
    const pos = ev.target.selectionStart;
    render();
    const again = document.querySelector('[data-filter="' + k + '"]');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { /* no aplica */ } }
  }, 250);
});
document.addEventListener('change', function (ev) {
  const t = ev.target;
  if (t.dataset && t.dataset.filter && t.tagName === 'SELECT') {
    S.f[t.dataset.filter] = t.value;
    if (t.dataset.filter === 'dtipo') S.f.dest = '';
    render();
  }
  if (t.dataset && t.dataset.actChange === 'proj-estado') {
    const p = proj(t.dataset.id);
    mutate('saveProyecto', [Object.assign({}, p, { estado: t.value }), false], 'Estado: ' + t.value);
  }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); });

load();
</script>
