<style>
  :root {
    --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f8fafc; --border: #e3e8f0;
    --text: #172033; --muted: #64748b; --primary: #1e40af; --primary-soft: #e0e8ff;
    --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #b91c1c; --bad-soft: #fee2e2; --info: #0369a1; --info-soft: #e0f2fe;
    --gray-soft: #eef1f5; --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1220; --surface: #161d2e; --surface-2: #1b2337; --border: #2a3450;
      --text: #e6eaf2; --muted: #95a1b8; --primary: #8aa8ff; --primary-soft: #23315a;
      --ok: #4ade80; --ok-soft: #14321f; --warn: #fbbf24; --warn-soft: #3a2c0c;
      --bad: #f87171; --bad-soft: #3b1515; --info: #38bdf8; --info-soft: #0c2a3b;
      --gray-soft: #232c42; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--primary); }

  #app { display: flex; min-height: 100vh; }
  .sidebar { width: 230px; background: #1e3a8a; color: #fff; padding: 18px 12px; position: sticky; top: 0;
    height: 100vh; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; padding: 4px 10px 18px; }
  .brand-mark { background: rgba(255,255,255,.15); border-radius: 8px; width: 32px; height: 32px;
    display: grid; place-items: center; }
  #nav button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 12px; border: 0;
    background: transparent; color: rgba(255,255,255,.82); border-radius: 10px; cursor: pointer; text-align: left; }
  #nav button:hover { background: rgba(255,255,255,.1); color: #fff; }
  #nav button.active { background: #fff; color: #1e3a8a; font-weight: 600; }
  .badge-count { margin-left: auto; background: #ef4444; color: #fff; font-size: 11px; border-radius: 99px;
    padding: 1px 7px; font-weight: 700; }

  main { flex: 1; min-width: 0; padding: 0 28px 40px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0 16px; }
  .topbar h1 { margin: 0; font-size: 22px; }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabbar { display: none; }

  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface);
    padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #0d1220; } }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .icon-btn { border: 0; background: transparent; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--muted); }
  .icon-btn:hover { background: var(--gray-soft); color: var(--text); }

  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 18px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
    box-shadow: var(--shadow); cursor: pointer; }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .kpi .sub { font-size: 12px; color: var(--muted); }
  .kpi.bad .value { color: var(--bad); } .kpi.warn .value { color: var(--warn); } .kpi.ok .value { color: var(--ok); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px;
    border-bottom: 1px solid var(--border); }
  .card-h h2, .card-h h3 { margin: 0; font-size: 16px; }
  .card-b { padding: 14px 16px; }
  .two-col { grid-template-columns: 1fr 1fr; }
  .empty { color: var(--muted); text-align: center; padding: 26px 10px; }

  .list-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border); }
  .list-item:last-child { border-bottom: 0; }
  .list-item .grow { flex: 1; min-width: 0; }
  .list-item .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .clickable { cursor: pointer; } .clickable:hover { background: var(--surface-2); }

  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
    background: var(--gray-soft); color: var(--muted); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.primary { background: var(--primary-soft); color: var(--primary); }

  .progress { height: 8px; background: var(--gray-soft); border-radius: 99px; overflow: hidden; min-width: 60px; }
  .progress > span { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
  .progress.ok > span { background: var(--ok); }

  .project-cards { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .pcard { padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
  .pcard:hover { border-color: var(--primary); }
  .pcard .code { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .pcard h3 { margin: 0; font-size: 17px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .small { font-size: 13px; } .muted { color: var(--muted); } .strong { font-weight: 600; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); min-width: 0; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
  .tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
  .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* Etapas como línea de tiempo */
  .stages-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .stage-chip { flex: 1 0 110px; border-radius: 10px; padding: 8px 10px; background: var(--gray-soft); font-size: 12px; }
  .stage-chip .n { font-weight: 700; font-size: 13px; color: var(--text); }
  .stage-chip.ok { background: var(--ok-soft); } .stage-chip.info { background: var(--info-soft); }
  .stage-chip.bad { background: var(--bad-soft); }
  .stage { margin-bottom: 14px; }
  .stage-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .stage-num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary);
    display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .stage-num.ok { background: var(--ok-soft); color: var(--ok); }

  .check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border); background: var(--surface);
    cursor: pointer; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-size: 13px; padding: 0; }
  .check.on { background: var(--ok); border-color: var(--ok); }
  .done .title { text-decoration: line-through; color: var(--muted); }

  /* Pipeline documentos */
  .pipeline { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .pipeline span { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--gray-soft); color: var(--muted); }
  .pipeline span.past { background: var(--primary-soft); color: var(--primary); }
  .pipeline span.cur { background: var(--primary); color: #fff; font-weight: 700; }
  .pipeline span.cur.bad { background: var(--bad); }

  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted);
    padding: 10px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  table.t td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.t tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(10,15,30,.5); display: flex; align-items: center;
    justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 560px; max-height: 92vh;
    display: flex; flex-direction: column; }
  .modal-h { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-h h3 { margin: 0; font-size: 17px; }
  .modal-b { padding: 16px 18px; overflow-y: auto; }
  .modal-f { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form .full { grid-column: 1 / -1; }
  .form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .form input, .form select, .form textarea { padding: 9px 11px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text); width: 100%; }
  .form textarea { min-height: 70px; resize: vertical; }
  .form .check-label { flex-direction: row; align-items: center; gap: 8px; }
  .form .check-label input { width: auto; }
  .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 16px; text-align: center; color: var(--muted);
    cursor: pointer; }
  .drop.has { border-color: var(--ok); color: var(--ok); }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s;
    z-index: 60; max-width: 90vw; }
  #toast.show { opacity: 1; } #toast.err { background: #b91c1c; }
  .loading { padding: 60px; text-align: center; color: var(--muted); }
  .saving main { opacity: .7; pointer-events: none; }

  /* ===== Celular ===== */
  @media (max-width: 820px) {
    .sidebar { display: none; }
    main { padding: 0 14px 96px; }
    .topbar { padding: 16px 0 12px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
    .topbar h1 { font-size: 19px; }
    .topbar .btn .lbl { display: none; }
    .topbar-actions { flex-wrap: nowrap; flex-shrink: 0; }
    .tabbar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
      border-top: 1px solid var(--border); z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
    .tabbar button { flex: 1; border: 0; background: transparent; padding: 8px 2px 9px; display: flex; flex-direction: column;
      align-items: center; gap: 2px; font-size: 11px; color: var(--muted); position: relative; }
    .tabbar button .ic { font-size: 19px; line-height: 1.1; }
    .tabbar button.active { color: var(--primary); font-weight: 600; }
    .tabbar .badge-count { position: absolute; top: 3px; right: calc(50% - 20px); margin: 0; }
    .two-col { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi .value { font-size: 22px; }
    .form { grid-template-columns: 1fr; }
    .modal-bg { align-items: flex-end; padding: 0; }
    .modal { border-radius: 18px 18px 0 0; max-height: 94vh; }
    .hide-m { display: none; }
    table.t th, table.t td { padding: 9px 10px; }
  }
</style>
